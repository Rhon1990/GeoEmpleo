name: Vista previa de interfaz GeoEmpleo

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "apps/web-preview/**"
      - "tools/build-static-site.mjs"
      - "tools/prepare-daily-refresh.mjs"
      - "tools/validate-daily-catalog.mjs"
      - "firebase.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/preview-ui.yml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: geoempleo-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview-ui:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias fijadas
        run: npm ci

      - name: Recuperar y contrastar el catálogo público vigente
        run: |
          node tools/prepare-daily-refresh.mjs
          for origin in https://geoempleo360.com https://geoempleo-49978.web.app; do
            node tools/validate-daily-catalog.mjs \
              --catalog apps/web-preview/public/data/calls.json \
              --matches-url "$origin/data/calls.json?preview=$GITHUB_RUN_ID"
          done

      - name: Construir vista previa con configuración pública
        env:
          GEOEMPLEO_GOOGLE_MAPS_API_KEY: ${{ secrets.GEOEMPLEO_GOOGLE_MAPS_API_KEY }}
          GEOEMPLEO_GOOGLE_MAPS_MAP_ID: ${{ secrets.GEOEMPLEO_GOOGLE_MAPS_MAP_ID }}
          GEOEMPLEO_ADSENSE_ENABLED: ${{ vars.GEOEMPLEO_ADSENSE_ENABLED }}
          GEOEMPLEO_ADSENSE_PUBLISHER_ID: ${{ vars.GEOEMPLEO_ADSENSE_PUBLISHER_ID }}
          GEOEMPLEO_ADSENSE_SLOT_ID: ${{ vars.GEOEMPLEO_ADSENSE_SLOT_ID }}
        run: |
          if [ -z "$GEOEMPLEO_GOOGLE_MAPS_API_KEY" ]; then
            echo 'Falta el secreto GEOEMPLEO_GOOGLE_MAPS_API_KEY.' >&2
            exit 1
          fi
          env_file="$RUNNER_TEMP/geoempleo.env"
          umask 077
          printf 'GEOEMPLEO_GOOGLE_MAPS_API_KEY=%s\nGEOEMPLEO_GOOGLE_MAPS_MAP_ID=%s\nGEOEMPLEO_ADSENSE_ENABLED=%s\nGEOEMPLEO_ADSENSE_PUBLISHER_ID=%s\nGEOEMPLEO_ADSENSE_SLOT_ID=%s\n' \
            "$GEOEMPLEO_GOOGLE_MAPS_API_KEY" "${GEOEMPLEO_GOOGLE_MAPS_MAP_ID:-}" \
            "${GEOEMPLEO_ADSENSE_ENABLED:-}" "${GEOEMPLEO_ADSENSE_PUBLISHER_ID:-}" "${GEOEMPLEO_ADSENSE_SLOT_ID:-}" > "$env_file"
          GEOEMPLEO_ENV_FILE="$env_file" npm run build:web:static

      - name: Bloquear cualquier cambio del catálogo en la vista previa
        run: |
          cmp apps/web-preview/public/data/calls.json var/public-site/data/calls.json
          for origin in https://geoempleo360.com https://geoempleo-49978.web.app; do
            node tools/validate-daily-catalog.mjs \
              --catalog var/public-site/data/calls.json \
              --matches-url "$origin/data/calls.json?preview=$GITHUB_RUN_ID-final"
          done
          test -f var/public-site/index.html

      - name: Publicar canal temporal de Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEOEMPLEO_49978 }}
          projectId: geoempleo-49978
          channelId: pr-${{ github.event.pull_request.number }}
          expires: 7d
          entryPoint: .
